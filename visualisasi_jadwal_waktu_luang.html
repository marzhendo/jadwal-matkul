    <style>
        body {

            width: 8px;

<body class="text-gray-800 antialiased min-h-screen flex flex-col">

    <header class="bg-blue-700 text-white shadow-md sticky top-0 z-10">

            <div>
                <h1 class="text-xl sm:text-2xl font-bold">HMIF Schedule Dashboard</h1>

            </div>
            
            <div class="flex gap-2 w-full sm:w-auto">

                </button>
                <button id="btnFree" class="flex-1 sm:flex-none px-4 py-2 bg-blue-800 text-blue-100 rounded-lg font-semibold shadow hover:bg-blue-600 transition-colors" onclick="switchView('free')">

    <main class="flex-grow max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8 w-full">

                    <select id="angkatanSelect" class="w-full border-gray-300 rounded-lg shadow-sm focus:border-blue-500 focus:ring-blue-500 p-2.5 bg-gray-50 border" onchange="updateKelasOptions()">

                        <option value="2025">Angkatan 2025</option>
                    </select>
                </div>

                        <!-- Options populated by JS -->
                    </select>
                </div>
            </div>
        </div>

        <div id="contentContainer" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 xl:grid-cols-5 gap-4">
            <!-- Cards will be injected here -->
        </div>

    </main>

        function parseCSV(csv) {
            const lines = csv.trim().split('\n');
            const headers = lines[0].split(',');
            return lines.slice(1).map(line => {
                const values = line.split(',');
                let obj = {};
                headers.forEach((h, i) => obj[h.trim()] = values[i] ? values[i].trim() : '-');
                return obj;
            });
        }

        const dataJadwal = parseCSV(csvJadwal);
        const dataWaktuLuang = parseCSV(csvWaktuLuang);
        
        const days = ['Senin', 'Selasa', 'Rabu', 'Kamis', 'Jumat'];
        let currentMode = 'jadwal'; // 'jadwal' or 'free'

        function switchView(mode) {
            currentMode = mode;
            
            const btnJadwal = document.getElementById('btnJadwal');
            const btnFree = document.getElementById('btnFree');
            
            if (mode === 'jadwal') {
                btnJadwal.classList.replace('bg-blue-800', 'bg-white');
                btnJadwal.classList.replace('text-blue-100', 'text-blue-700');
                btnJadwal.classList.remove('hover:bg-blue-600');
                
                btnFree.classList.replace('bg-white', 'bg-blue-800');
                btnFree.classList.replace('text-blue-700', 'text-blue-100');
                btnFree.classList.add('hover:bg-blue-600');
            } else {
                btnFree.classList.replace('bg-blue-800', 'bg-white');
                btnFree.classList.replace('text-blue-100', 'text-blue-700');
                btnFree.classList.remove('hover:bg-blue-600');
                
                btnJadwal.classList.replace('bg-white', 'bg-blue-800');
                btnJadwal.classList.replace('text-blue-700', 'text-blue-100');
                btnJadwal.classList.add('hover:bg-blue-600');
            }
            
            renderContent();
        }

        function updateKelasOptions() {
            const angkatan = document.getElementById('angkatanSelect').value;
            const kelasSelect = document.getElementById('kelasSelect');
            kelasSelect.innerHTML = ''; // Clear previous
            
            // Extract unique class names for selected Angkatan
            const classSet = new Set();
            dataJadwal.forEach(row => {
                if(row.Angkatan === angkatan) classSet.add(row.Kelas);
            });
            
            Array.from(classSet).sort().forEach(cls => {
                const opt = document.createElement('option');
                opt.value = cls;
                opt.textContent = cls;
                kelasSelect.appendChild(opt);
            });
            
            renderContent();
        }

        function renderContent() {
            const container = document.getElementById('contentContainer');
            container.innerHTML = '';
            
            const angkatan = document.getElementById('angkatanSelect').value;
            const kelas = document.getElementById('kelasSelect').value;
            
            const dataSource = currentMode === 'jadwal' ? dataJadwal : dataWaktuLuang;
            
            // Filter Data for specific class
            const filtered = dataSource.filter(row => row.Angkatan === angkatan && row.Kelas === kelas);
            
            days.forEach(day => {
                const dayData = filtered.filter(row => row.Hari.toLowerCase() === day.toLowerCase());
                
                // Sort by Start time
                dayData.sort((a, b) => {
                    const timeA = a.Mulai || a['Mulai Free'];
                    const timeB = b.Mulai || b['Mulai Free'];
                    return timeA.localeCompare(timeB);
                });

                // Create Card element
                const card = document.createElement('div');
                card.className = "bg-white rounded-xl shadow-sm border border-gray-100 flex flex-col overflow-hidden transition-all hover:shadow-md";
                
                // Card Header (Day)
                const headerColor = currentMode === 'jadwal' ? 'bg-blue-50 text-blue-800 border-blue-100' : 'bg-green-50 text-green-800 border-green-100';
                card.innerHTML = `
                    <div class="px-4 py-3 border-b font-bold ${headerColor}">
                        ${day}
                    </div>
                `;
                
                // Card Body (Items)
                const list = document.createElement('div');
                list.className = "p-0 flex-grow divide-y divide-gray-50";
                
                if (dayData.length === 0) {
                    list.innerHTML = `<div class="p-4 text-center text-sm text-gray-400 italic">Tidak ada data</div>`;
                } else {
                    dayData.forEach(item => {
                        const div = document.createElement('div');
                        div.className = "p-4 hover:bg-gray-50 transition-colors";
                        
                        if (currentMode === 'jadwal') {
                            div.innerHTML = `
                                <div class="text-xs font-semibold text-gray-500 mb-1 flex items-center gap-1">
                                    <svg class="w-3 h-3" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
                                    ${item.Mulai} - ${item.Selesai} WIB
                                </div>
                                <div class="font-medium text-gray-800 leading-tight mb-2">${item['Mata Kuliah']}</div>
                                <div class="flex flex-wrap gap-2 text-xs">
                                    ${item['Kode MK'] !== '-' ? `<span class="bg-gray-100 text-gray-600 px-2 py-1 rounded border">${item['Kode MK']}</span>` : ''}
                                    ${item['Ruangan'] !== '-' ? `<span class="bg-blue-50 text-blue-600 px-2 py-1 rounded border border-blue-100 flex items-center gap-1"><svg class="w-3 h-3" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17.657 16.657L13.414 20.9a1.998 1.998 0 01-2.827 0l-4.244-4.243a8 8 0 1111.314 0z"></path><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 11a3 3 0 11-6 0 3 3 0 016 0z"></path></svg>${item['Ruangan']}</span>` : ''}
                                </div>
                            `;
                        } else {
                            div.innerHTML = `
                                <div class="font-bold text-green-600 text-lg flex items-center gap-2">
                                   <svg class="w-5 h-5 text-green-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"></path></svg>
                                   ${item['Mulai Free']} - ${item['Selesai Free']}
                                </div>
                                <div class="text-xs text-gray-500 mt-1">Status: Kosong / Waktu Luang</div>
                            `;
                        }
                        list.appendChild(div);
                    });
                }
                
                card.appendChild(list);
                container.appendChild(card);
            });
        }

        window.onload = () => {
            updateKelasOptions(); 
            // renderContent dipanggil otomatis di akhir updateKelasOptions
        };
    </script>
